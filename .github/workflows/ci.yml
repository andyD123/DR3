name: Build and Unittest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Release
          - os: windows-latest
            compiler: msvc
            build_type: Debug
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
          - os: ubuntu-latest
            compiler: gcc
            build_type: Debug
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -DDR3_BUILD_TESTS=ON -DDR3_BUILD_EXAMPLES=ON -DDR3_ISA=AVX2

      - name: Configure (Ubuntu GCC)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDR3_BUILD_TESTS=ON \
            -DDR3_BUILD_EXAMPLES=ON \
            -DDR3_ISA=AVX2

      - name: Configure (Ubuntu Clang)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DDR3_BUILD_TESTS=ON \
            -DDR3_BUILD_EXAMPLES=ON \
            -DDR3_ISA=AVX2

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

  package-consumer:
    name: ${{ matrix.os }} ${{ matrix.compiler }} package consumers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            compiler_args: ""
          - os: ubuntu-latest
            compiler: gcc
            compiler_args: -DCMAKE_CXX_COMPILER=g++
          - os: ubuntu-latest
            compiler: clang
            compiler_args: -DCMAKE_CXX_COMPILER=clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure package producer
        run: >-
          cmake -S . -B package-build
          -DCMAKE_BUILD_TYPE=Release
          -DDR3_BUILD_TESTS=OFF
          -DDR3_BUILD_EXAMPLES=OFF
          ${{ matrix.compiler_args }}

      - name: Build package producer
        run: cmake --build package-build --config Release

      - name: Install package
        run: >-
          cmake --install package-build --config Release
          --prefix "${{ github.workspace }}/package-prefix"

      - name: Configure package consumer
        run: >-
          cmake -S tests/package_consumer -B package-consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/package-prefix"
          -DDR3_EXPECTED_ISA=AVX2
          ${{ matrix.compiler_args }}

      - name: Build shared package consumer
        run: cmake --build package-consumer-build --config Release

      - name: Test shared package consumer
        run: >-
          ctest --test-dir package-consumer-build -C Release
          --output-on-failure --timeout 60

      - name: Configure subdirectory consumer
        run: >-
          cmake -S tests/subdirectory_consumer -B subdirectory-consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DDR3_ROOT="${{ github.workspace }}"
          ${{ matrix.compiler_args }}

      - name: Build subdirectory consumer
        run: cmake --build subdirectory-consumer-build --config Release

      - name: Test subdirectory consumer
        run: >-
          ctest --test-dir subdirectory-consumer-build -C Release
          --output-on-failure --timeout 60

      - name: Reject unsupported ISA
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          if cmake -S . -B invalid-isa-build \
              -DDR3_BUILD_TESTS=OFF \
              -DDR3_BUILD_EXAMPLES=OFF \
              -DDR3_ISA=NOT_A_REAL_ISA; then
            echo "Unsupported DR3_ISA unexpectedly configured"
            exit 1
          fi

  package-isa-variants:
    name: ubuntu gcc ${{ matrix.isa }} installed package
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: SSE2
            run_consumer: true
          - isa: AVX512
            run_consumer: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure package producer
        run: >-
          cmake -S . -B package-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DDR3_BUILD_TESTS=OFF
          -DDR3_BUILD_EXAMPLES=OFF
          -DDR3_ISA=${{ matrix.isa }}

      - name: Build package producer
        run: cmake --build package-build --config Release

      - name: Install package
        run: >-
          cmake --install package-build --config Release
          --prefix "${{ github.workspace }}/package-prefix"

      - name: Configure shared package consumer
        run: >-
          cmake -S tests/package_consumer -B package-consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/package-prefix"
          -DDR3_EXPECTED_ISA=${{ matrix.isa }}

      - name: Build shared package consumer
        run: cmake --build package-consumer-build --config Release

      - name: Run SSE2 package consumer
        if: matrix.run_consumer
        run: >-
          ctest --test-dir package-consumer-build -C Release
          --output-on-failure --timeout 60

      - name: Confirm AVX512 is compile-only
        if: matrix.run_consumer == false
        run: echo "AVX512 producer and consumer compiled; execution intentionally skipped"

  sanitizers:
    name: ubuntu gcc Debug ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDR3_BUILD_TESTS=ON \
            -DDR3_BUILD_EXAMPLES=OFF \
            -DDR3_ENABLE_SANITIZERS=ON \
            -DDR3_ISA=AVX2
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 180
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
